<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>동아리 방명록</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    font-family: system-ui, "Segoe UI", "Malgun Gothic", sans-serif;
    background: #f6f7f9; color: #1a1a1a;
  }
  @media (prefers-color-scheme: dark) { body { background: #16181c; color: #eceef1; } }
  main { text-align: center; padding: 2rem 1.5rem; max-width: 22rem; }
  h1 { font-size: 1.4rem; margin: 0 0 .4rem; }
  p.sub { margin: 0 0 2rem; opacity: .6; font-size: .9rem; }
  #status { min-height: 1.4rem; margin-top: 1rem; font-size: .9rem; opacity: .75; }
  #roster { margin-top: 1.2rem; font-size: .85rem; opacity: .55; line-height: 1.5; }
  #guide { font-size: .95rem; line-height: 1.6; margin: 0; }
  button.sign {
    font: inherit; font-weight: 600; padding: .85rem 1.4rem; width: 100%;
    border: 0; border-radius: .6rem; background: #1a73e8; color: #fff; cursor: pointer;
  }
  button.sign:disabled { background: #9aa0a6; cursor: default; }
  #gbtn { display: flex; justify-content: center; }
  input {
    font: inherit; width: 100%; box-sizing: border-box; margin-bottom: .5rem;
    padding: .7rem .8rem; border: 1px solid #c4c7cc; border-radius: .5rem;
    background: transparent; color: inherit;
  }
  input:invalid:not(:placeholder-shown) { border-color: #d93025; }
</style>
</head>
<body>
<main>
  <h1>동아리 방명록</h1>
  <p class="sub">구글 계정으로 방문을 남겨주세요</p>
  <div id="gbtn"></div>
  <div id="action"></div>
  <div id="status">구글 계정 확인 중…</div>
  <div id="roster"></div>
</main>

<script>
const CLIENT_ID = "60891083163-acnj22k5h7m921srilkdvbi8is0o60sv.apps.googleusercontent.com";
const ENDPOINT  = "https://script.google.com/macros/s/AKfycbxBwVkyj3PLy0nKJmBXPFN-UweRpH99d-p3SbkF1XUQf4pKt086OcXHm1_UCcnA6W-X/exec";

const $ = id => document.getElementById(id);
let credential = null;
let profile = null;

const payload = jwt => JSON.parse(new TextDecoder().decode(
  Uint8Array.from(atob(jwt.split(".")[1].replace(/-/g, "+").replace(/_/g, "/")), c => c.charCodeAt(0))
));

function onCredential(res) {
  credential = res.credential;
  const p = payload(credential);
  $("gbtn").innerHTML = "";
  $("status").textContent = "";
  showButton((p.name || p.email) + "님으로 방명록 남기기");
}

function showButton(label) {
  $("action").innerHTML = '<button class="sign" id="submit"></button>';
  $("submit").textContent = label;
  $("submit").onclick = () => submit();
}

const getPos = () => new Promise(done => {
  if (!navigator.geolocation) return done({ error: "unavailable" });
  navigator.geolocation.getCurrentPosition(
    p => done({ lat: p.coords.latitude, lon: p.coords.longitude, acc: Math.round(p.coords.accuracy) }),
    e => done({ error: e.code === 1 ? "denied" : "unavailable" }),
    { enableHighAccuracy: false, timeout: 10000, maximumAge: 60000 }
  );
});

const POS_HELP = {
  denied: "위치 권한이 차단되어 있습니다. 주소창의 자물쇠(또는 ⓘ) → 권한 → 위치를 " +
          "'허용'으로 바꾼 뒤 새로고침해주세요.",
  unavailable: "위치를 찾지 못했습니다. 창가로 이동하거나 잠시 후 다시 눌러주세요."
};

async function submit() {
  const btn = $("submit");
  btn.disabled = true;
  $("status").textContent = "위치 확인 중…";
  const geo = await getPos();
  const pos = geo.error ? null : geo;
  $("status").textContent = "기록 중…";
  try {
    const r = await fetch(ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(Object.assign({ credential: credential, pos: pos }, profile))
    });
    const data = await r.json();

    if (data.needProfile) return askProfile();
    if (data.recent) {
      btn.textContent = "✓ 이미 기록됨";
      $("status").textContent = "1시간 이내에 이미 남기셨어요.";
    } else if (data.ok === true) {
      btn.textContent = "✓ 기록 완료";
      $("status").textContent = "방문해주셔서 감사합니다!";
    } else {
      btn.disabled = false;
      $("status").textContent = geo.error
        ? POS_HELP[geo.error]
        : "지금은 기록할 수 없습니다.";
    }
    showRoster(data);
  } catch (e) {
    btn.disabled = false;
    $("status").textContent = "연결에 실패했습니다. 다시 눌러주세요.";
  }
}

function showRoster(data) {
  if (!data.visitors || !data.visitors.length) return;
  const more = data.more ? ` 외 ${data.more}명` : "";
  $("roster").textContent = "최근 1시간 입장: " + data.visitors.join(", ") + more;
}

function askProfile() {
  $("action").innerHTML = `
    <form id="profile-form">
      <input id="name" placeholder="이름" required>
      <input id="sid" placeholder="학번 (숫자 12자리)" inputmode="numeric"
             pattern="\\d{12}" maxlength="12" required>
      <button class="sign" type="submit">등록하고 방명록 남기기</button>
    </form>`;
  $("name").value = payload(credential).name || "";
  $("status").textContent = "처음 오셨네요. 이름과 학번을 입력해주세요.";
  $("profile-form").onsubmit = ev => {
    ev.preventDefault();
    profile = { name: $("name").value.trim(), studentId: $("sid").value.trim() };
    showButton("등록 중…");
    submit();
  };
}

const IN_APP = /KAKAOTALK|Instagram|FBAN|FBAV|FB_IAB|Line\/|NAVER|DaumApps|everytime/i
  .test(navigator.userAgent);

window.onload = () => {
  if (IN_APP) {
    $("action").innerHTML = '<p id="guide"></p>';
    $("guide").textContent =
      "카카오톡 안에서는 구글 로그인이 되지 않습니다. " +
      "오른쪽 아래 메뉴(⋯)에서 '다른 브라우저로 열기'를 눌러주세요.";
    $("status").textContent = "";
    return;
  }

  google.accounts.id.initialize({
    client_id: CLIENT_ID,
    callback: onCredential,
    auto_select: true
  });
  google.accounts.id.renderButton($("gbtn"), { theme: "outline", size: "large", text: "signin_with", locale: "ko" });
  google.accounts.id.prompt(n => {
    if (!n.isDisplayed() && !n.isSkippedMoment()) return;
    $("status").textContent = "위 버튼으로 로그인해주세요";
  });
};
</script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
</body>
</html>
